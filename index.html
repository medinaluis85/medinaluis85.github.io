<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>medinaluis85</title>
<style>
  :root { --bg1:#3a2416; --bg2:#22150d; --cream:#f2e8d8; --dim:#d6c7b0; --amber:#e8a44c; }
  body { margin:0; background:linear-gradient(180deg,var(--bg1),var(--bg2)); color:var(--cream);
         font:17px/1.65 Georgia, 'Times New Roman', serif; }
  .wrap { max-width:640px; margin:0 auto; padding:80px 24px; text-align:center; }
  h1 { font-size:2rem; margin:0 0 6px; }
  .rule { display:flex; align-items:center; gap:12px; margin:18px 0 30px; }
  .rule::before, .rule::after { content:""; flex:1; height:3px; background:var(--amber); }
  .rule span { width:12px; height:12px; background:var(--amber); transform:rotate(45deg); }
  p { color:var(--dim); }
  a { color:var(--amber); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Dinner, decided.</h1>
  <div class="rule"><span></span></div>
  <p>This is the domain root for <strong>medinaluis85.github.io</strong>.</p>
  <p>Our app: <strong>Dinner Truce</strong> — the nightly dinner-decision app
  for Android. <a href="https://github.com/medinaluis85/dinner-picker-android">Repository</a>
  &middot; <a href="https://medinaluis85.github.io/dinner-truce-privacy/">Privacy policy</a></p>
  <p style="font-size:14px; margin-top:40px">The root also hosts
  <a href="/app-ads.txt">app-ads.txt</a> for the app's ad-supported
  features.</p>
</div>
</body>
</html>
